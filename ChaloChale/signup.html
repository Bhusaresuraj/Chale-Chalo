
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Chalo Chale</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

      <a class="navbar-brand fw-bold" href="#">Chalo Chale</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto align-items-lg-center">

          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Destination</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Package</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Booking</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>


           <li class="nav-item ms-lg-3 my-2 my-lg-0">
            <a class="btn btn-warning" href="signup.html">Sign Up</a>
          </li>

          <li class="nav-item ms-lg-3 my-2 my-lg-0">
            <a class="btn btn-warning" href="login.html">Login</a>
          </li>

        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="card shadow-sm">
          <div class="card-body p-4">

            <h2 class="text-center mb-4">Login</h2>

            <form onsubmit="return validate()">
              <div class="mb-3">
                <label for="email" class="form-label">
                  Email address
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="Enter your email"
                  required
                >

              </div>

              <div class="mb-3">
                <label for="password" class="form-label">
                  Password
                </label>

                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Enter your password"
                  required
                >
              </div>

              <div class="mb-3 form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="remember"
                >

                <label class="form-check-label" for="remember">
                  Remember me
                </label>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Submit
              </button>
            </form>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script rel="stylesheet" href="script.js"></script>

  
  <footer class="bg-dark text-white mt-5">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <p class="text-center py-3 mb-0">
            Copyright &copy; 2026 ChaloChale. All rights reserved.
          </p>
        </div>
      </div>
    </div>
  </footer>




  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>
</html>
